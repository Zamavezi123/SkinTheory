<h1>Enquiry</h1>
<p>Whether you have a question about our formulations, would like to check stock,
or wish to place an order, we would be happy to hear from you.</p>

<form action="thankyou.html" method="get">

<label for="fullname">Full name (required)</label>
<input type="text" id="fullname" name="Full Name" required>

<label for="email">Email address (required)</label>
<input type="email" id="email" name="Email" required>

<label for="phone">Phone number (optional)</label>
<input type="text" id="phone" name="Phone">

<label for="message">Enquiry message (required)</label>
<textarea id="message" name="Message" rows="5" required></textarea>

<input type="submit" value="Send Enquiry">
</form>
